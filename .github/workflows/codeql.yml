name: CodeQL Advanced
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 2'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        if: matrix.language == 'java-kotlin'
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Android for analysis
        if: matrix.language == 'java-kotlin'
        run: gradle --no-daemon --no-build-cache --rerun-tasks :app:assembleDebug --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
