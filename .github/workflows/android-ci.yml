name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Generate CI-only debug signing key
        run: >-
          keytool -genkeypair -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048
          -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
      - name: Test source manifest and failed-build preservation
        run: python3 -m unittest discover -s scripts -p 'test_blocklist_metadata.py'
      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/build/ci-diagnostics
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee app/build/ci-diagnostics/android-build.log
      - name: Preserve full unit regression XML
        if: always()
        run: |
          mkdir -p app/build/ci-diagnostics/full-unit-results
          cp app/build/test-results/testDebugUnitTest/*.xml app/build/ci-diagnostics/full-unit-results/ || true
      - name: Render real source-freshness screen for visual review
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.SourceFreshnessScreenshotTest -Proborazzi.test.record=true --stacktrace
      - name: Render community links
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.example.community.CommunityCardTest -Proborazzi.test.record=true --stacktrace
      - name: Upload build log and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/metadata-update-notice.png
            app/build/outputs/community-*.png
            app/build/ci-diagnostics/android-build.log
            app/build/outputs/source-freshness.png
            app/build/outputs/ecosystem-version-header.png
          if-no-files-found: warn

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Genuine own-app security proof on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/security-proof.sh
      - name: Upload genuine fixture and candidate UI proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SensorGuard-own-app-security-proof
          path: |
            proof-evidence/
            app/build/ci-diagnostics/full-unit-results/
          if-no-files-found: error
